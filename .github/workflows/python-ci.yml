name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi uvicorn sqlalchemy requests pandas flake8 black scikit-learn joblib seaborn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Train ML Model
      run: |
        python Projects/ML_Project/Titanic_ML.py

    - name: Run Black (Formatting Check)
      run: |
        black --check Python Projects Testing

    - name: Run Flake8 (Linting)
      run: |
        flake8 Python Projects Testing --max-line-length=120 --ignore=E402,W503

    - name: Run Pytest
      run: |
        pytest Projects/API_Database_Project Projects/ETL_Project

